name: Vigilar precios (rápido)

# Cada hora, solo con las fuentes de API. Una consulta a Ouigo tarda ~1 s, así
# que revisar los viajes vigilados y los días baratos cuesta un par de minutos
# y no supone apenas carga para nadie.
#
# Renfe NO entra aquí: va por navegador, tarda ~30 s por consulta y hacerlo
# cada hora sería machacar su web sin ganar nada. Está en vigilar-completo.yml.

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      top_dias:
        description: "Cuántos días baratos revisar por ruta"
        default: "8"

concurrency:
  group: datos            # nunca dos workflows escribiendo data/ a la vez
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TOP_DIAS: ${{ inputs.top_dias || '8' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar los viajes vigilados
        run: python -m buscador vigilar --fuentes ouigo --guardar --avisar

      - name: Profundizar en los días más baratos
        run: python -m buscador buscar --top-dias "$TOP_DIAS" --fuentes ouigo --guardar --avisar

      - name: Guardar los datos en el repositorio
        run: |
          git config user.name  "buscador-trenes[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Sin cambios en los precios."
            exit 0
          fi
          git commit -m "datos: vigilancia rápida $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash
          git push
