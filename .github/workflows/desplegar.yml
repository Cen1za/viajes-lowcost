name: Desplegar la PWA

# Publica la app en GitHub Pages. Se dispara cuando cambia la web y también
# cuando los workflows de búsqueda comitean precios nuevos en data/.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/**"
      - ".github/workflows/desplegar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        working-directory: web
        run: npm ci

      - name: Copiar los precios dentro de la web
        # La PWA lee ./data/*.json, así que los JSON del repositorio tienen que
        # viajar dentro de la build.
        run: |
          mkdir -p web/public/data
          cp data/*.json web/public/data/ 2>/dev/null || echo "Aún no hay datos."

      - name: Compilar
        working-directory: web
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
